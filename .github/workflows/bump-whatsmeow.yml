name: Bump whatsmeow
on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.0'
      - run: |
          make tools
          PATH="$PWD/.tools/bin:$PATH" GOPATH="$PWD/.cache/gopath" GOMODCACHE="$PWD/.cache/gomod" GOCACHE="$PWD/.cache/gocache" GOBIN="$PWD/.tools/bin" go get go.mau.fi/whatsmeow@main
          PATH="$PWD/.tools/bin:$PATH" GOPATH="$PWD/.cache/gopath" GOMODCACHE="$PWD/.cache/gomod" GOCACHE="$PWD/.cache/gocache" GOBIN="$PWD/.tools/bin" go mod tidy
          make check
      - uses: peter-evans/create-pull-request@v8
        with:
          commit-message: 'chore: bump whatsmeow'
          title: 'chore: bump whatsmeow'
          branch: automation/bump-whatsmeow
